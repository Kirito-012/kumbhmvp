allowBuilds:
  esbuild: true
  mongodb-memory-server: true
  sharp: true
  unrs-resolver: true

# jsdom@29.x/30.x (isomorphic-dompurify's declared dependency, used for
# server-side HTML sanitization in src/lib/sanitize-html.ts) pulls in
# @exodus/bytes through THREE separate paths at once -- directly, plus
# transitively via both html-encoding-sniffer@6.x and whatwg-url@16-17.x.
# @exodus/bytes is ESM-only in every published version ("type": "module"),
# so any CommonJS require() of it throws ERR_REQUIRE_ESM. This doesn't
# surface locally, but breaks in Vercel's production Node runtime with
# "Failed to load external module isomorphic-dompurify-<hash>" (tried
# overriding html-encoding-sniffer and whatwg-url individually first --
# each fix just exposed the next @exodus/bytes path). jsdom itself is
# pinned to 27.3.0, the newest version before @exodus/bytes was adopted
# anywhere in its tree (confirmed via `npm view jsdom@<version>
# dependencies` across the 24.x-30.x range) -- this overrides
# isomorphic-dompurify's own declared `jsdom: ^30.0.0` range, but the only
# jsdom API surface DOMPurify actually uses (constructing a JSDOM window to
# run browser DOMPurify against) has been stable across these versions.
overrides:
  jsdom: 27.3.0
