# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - kumbhMela

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        # --node-linker=hoisted gives a flat node_modules with no .pnpm symlink farm.
        # The build MUST run against the same layout that ships: Next bakes resolved
        # dependency paths into .next/**/*.nft.json, so building against pnpm's default
        # symlinked tree and then swapping in a flat one leaves the server chasing
        # node_modules/.pnpm/... paths that no longer exist.
        run: pnpm install --frozen-lockfile --node-linker=hoisted

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}

      - name: Assemble the standalone server
        # next.config.ts sets output:'standalone', so the build emits .next/standalone
        # containing server.js plus only the node_modules the trace says the server needs.
        # Next does not copy public/ or .next/static into it, so do that here.
        #
        # node_modules is stashed as a tarball we control rather than shipped as a live
        # directory. Azure's Oryx startup script rewrites any ./node_modules it finds --
        # it moves the directory to _del_node_modules and symlinks ./node_modules at its
        # own /node_modules -- which destroys the bundled tree before server.js can load
        # it. A tarball is invisible to that logic, and startup.sh unpacks it at boot.
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp startup.sh .next/standalone/startup.sh

          # Two separate pnpm-layout problems have to be fixed before this tree can
          # run anywhere but the build machine.
          #
          # 1. SHADOWING STUBS. Next's tracer emits ~40 packages as a top-level stub
          #    node_modules/<pkg>/ containing only package.json, leaving the real files
          #    at .pnpm/<pkg>@<ver>/node_modules/<pkg>/. Node resolves a deep subpath
          #    against the FIRST <pkg> it finds -- the stub -- and throws
          #    MODULE_NOT_FOUND; it does not walk on to .pnpm/. This is what crashed
          #    production with
          #      Cannot find module '.../node_modules/@swc/helpers/cjs/_interop_require_default.cjs'
          #    (An earlier comment here claimed Node had a "directory-walk resolution"
          #    that found the real content at the intermediate .pnpm/node_modules path.
          #    It does not; that belief is why the bug survived several fixes.)
          #    The script below replaces each stub with the real directory, choosing it
          #    by the exact version the stub's package.json pins, and fails the build if
          #    any stub cannot be resolved unambiguously.
          #
          # 2. ABSOLUTE SYMLINKS. The tracer also emits entries pointing into the store
          #    via symlinks to absolute build-machine paths, which resolve nowhere else.
          #    `tar -h` dereferences them into real files.
          #
          # Flattening (1) first also removes the deploy's dependence on the fragile part
          # of (2): the stubs used to be rescued only incidentally, by -h dereferencing
          # .pnpm/node_modules/<pkg>, which is why excluding that path broke production
          # and why the semver exclude below is safe.
          bash scripts/flatten-standalone-node-modules.sh .next/standalone/node_modules

          # tar -h occasionally races on this runner: GNU tar lstats a symlink, then
          # finds the target gone when it opens it ("File removed before we read it"),
          # aborting the step. Transient, not a real missing file -- retrying clears it.
          #
          # The exception is node_modules/.pnpm/node_modules/semver, which vanishes
          # every attempt, every run. It is safe to drop: every traced reference
          # (.next/**/*.nft.json) comes from devDependency-only tooling (eslint/babel/
          # mongodb-memory-server) that never runs in the built server, and
          # `grep -r 'require("semver"' .next/standalone` finds nothing. Excluding this
          # one path leaves every other .pnpm/node_modules/* package untouched. Do NOT
          # broaden it to .pnpm/node_modules/* -- that shipped a broken tree before.
          for attempt in 1 2 3; do
            rm -f .next/standalone/app-node-modules.tar.gz
            if tar -czhf .next/standalone/app-node-modules.tar.gz -C .next/standalone \n                 --exclude='node_modules/.pnpm/node_modules/semver' \n                 node_modules; then
              break
            fi
            echo "tar attempt $attempt failed" >&2
            if [ "$attempt" -eq 3 ]; then
              echo "FATAL: tar failed after 3 attempts." >&2
              exit 1
            fi
            sleep 2
          done

          # Prove the archive is self-contained before shipping it: no symlinks left, and
          # the two modules whose absence broke earlier deploys are really in there --
          # as files, at the top-level path Node will actually look at.
          if tar -tvzf .next/standalone/app-node-modules.tar.gz | grep -q '^l'; then
            echo "FATAL: app-node-modules.tar.gz still contains symlinks." >&2
            tar -tvzf .next/standalone/app-node-modules.tar.gz | grep '^l' | head >&2
            exit 1
          fi
          for required in \n            'node_modules/next/dist/compiled/cookie/index.js' \n            'node_modules/@swc/helpers/cjs/_interop_require_default.cjs'; do
            if ! tar -tzf .next/standalone/app-node-modules.tar.gz | grep -qx "$required"; then
              echo "FATAL: $required missing from the archive." >&2
              exit 1
            fi
          done
          rm -rf .next/standalone/node_modules

      - name: Package the standalone output as a tarball
        # Tar rather than upload-artifact's native zip: zip preserves neither symlinks
        # nor executable bits, which is what broke the original deploy.
        run: tar -czf /tmp/node-app.tar.gz -C .next/standalone .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: /tmp/node-app.tar.gz
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unpack the tarball
        run: |
          mkdir -p app
          tar -xzf node-app.tar.gz -C app
          rm node-app.tar.gz

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E0EDA43D367A462CA14F8D6DF79C4131 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_261324D46CC146EE961444A85D0AA58B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EF7FFC283A3A4C5CB21924D53EB656EA }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kumbhMela'
          slot-name: 'Production'
          package: app
          startup-command: 'sh /home/site/wwwroot/startup.sh'
          clean: true
          restart: true
