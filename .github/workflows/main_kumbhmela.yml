# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - kumbhMela

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        # npm produces a genuinely flat node_modules: every package is a real directory
        # of real files, and a package needing a different version of a transitive
        # dependency gets its own nested copy. Nothing is a symlink into a content store.
        #
        # This matters because Next bakes the resolved dependency layout into
        # .next/**/*.nft.json at build time. Under pnpm the build resolved packages
        # through .pnpm/<pkg>@<ver>/node_modules/<pkg>, so the shipped tree had to be
        # reshaped afterwards to match -- and every package that reshaping missed
        # crashed the server at runtime, one at a time. With npm the tree built against
        # is already the tree that ships, so there is nothing to reshape.
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}

      - name: Assemble the standalone server
        # next.config.ts sets output:'standalone', so the build emits .next/standalone
        # containing server.js plus only the node_modules the trace says the server needs.
        # Next does not copy public/ or .next/static into it, so do that here.
        #
        # node_modules is stashed as a tarball we control rather than shipped as a live
        # directory. Azure's Oryx startup script rewrites any ./node_modules it finds --
        # it moves the directory to _del_node_modules and symlinks ./node_modules at its
        # own /node_modules -- which destroys the bundled tree before server.js can load
        # it. A tarball is invisible to that logic, and startup.sh unpacks it at boot.
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp startup.sh .next/standalone/startup.sh

          # The tracer emits a few entries as symlinks into the build workspace
          # (Next externalizes some server packages under .next/node_modules/<pkg>-<hash>).
          # Those absolute paths exist only on the runner, so -h dereferences them.
          rm -f .next/standalone/app-node-modules.tar.gz
          tar -czhf .next/standalone/app-node-modules.tar.gz -C .next/standalone node_modules

          # Prove the archive is self-contained before shipping it.
          if tar -tvzf .next/standalone/app-node-modules.tar.gz | grep -q '^l'; then
            echo "FATAL: app-node-modules.tar.gz still contains symlinks." >&2
            tar -tvzf .next/standalone/app-node-modules.tar.gz | grep '^l' | head >&2
            exit 1
          fi
          if tar -tzf .next/standalone/app-node-modules.tar.gz | grep -q '/[.]pnpm/'; then
            echo "FATAL: archive contains .pnpm paths; the tree is not flat." >&2
            exit 1
          fi
          for required in \
            'node_modules/next/dist/compiled/cookie/index.js' \
            'node_modules/@swc/helpers/cjs/_interop_require_default.cjs'; do
            if ! tar -tzf .next/standalone/app-node-modules.tar.gz | grep -qx "$required"; then
              echo "FATAL: $required missing from the archive." >&2
              exit 1
            fi
          done
          rm -rf .next/standalone/node_modules

      - name: Package the standalone output as a tarball
        # Tar rather than upload-artifact's native zip: zip preserves neither symlinks
        # nor executable bits, which is what broke the original deploy.
        run: tar -czf /tmp/node-app.tar.gz -C .next/standalone .

      - name: Smoke-test the packaged artifact
        # Boot the artifact the way Azure will and prove it serves a real request.
        #
        # Every past production break -- @swc/helpers, then bson -- got through because
        # the build was green and nothing here ever loaded the packaged tree. This runs
        # in a directory with no node_modules above it, so anything the server resolves
        # must come from the archive itself.
        run: |
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke
          tar -xzf /tmp/node-app.tar.gz -C /tmp/smoke
          cd /tmp/smoke

          # the same unpack startup.sh performs at boot
          tar -xzf app-node-modules.tar.gz
          test -d node_modules/next || { echo "FATAL: node_modules/next missing." >&2; exit 1; }

          PORT=3987 HOSTNAME=127.0.0.1 AUTH_TRUST_HOST=true \
            NEXTAUTH_SECRET=smoke NEXTAUTH_URL=http://127.0.0.1:3987 \
            NEXT_PUBLIC_MAPTILER_KEY=smoke \
            node server.js > /tmp/smoke-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl -sf -o /dev/null -m 2 \
                 -H 'Host: kumbhdrishti.thecraftsync.com' \
                 -H 'x-forwarded-proto: https' \
                 http://127.0.0.1:3987/login; then
              break
            fi
            if ! kill -0 $server_pid 2>/dev/null; then
              echo "FATAL: server exited during startup." >&2
              cat /tmp/smoke-server.log >&2
              exit 1
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "FATAL: server did not become ready within 60s." >&2
              cat /tmp/smoke-server.log >&2
              exit 1
            fi
          done

          # The app 308-redirects anything that is not the canonical host, so send that
          # Host header; otherwise nothing ever renders and the assertion is vacuous.
          for route in /login /register; do
            code=$(curl -s -o /tmp/smoke-body -w '%{http_code}' -m 30 \
                     -H 'Host: kumbhdrishti.thecraftsync.com' \
                     -H 'x-forwarded-proto: https' \
                     "http://127.0.0.1:3987$route")
            if [ "$code" != "200" ]; then
              echo "FATAL: $route returned $code, expected 200." >&2
              head -c 2000 /tmp/smoke-body >&2
              echo >&2
              cat /tmp/smoke-server.log >&2
              exit 1
            fi
            echo "$route -> 200 ($(wc -c < /tmp/smoke-body) bytes)"
          done

          if grep -qiE "cannot find module|MODULE_NOT_FOUND" /tmp/smoke-server.log; then
            echo "FATAL: module resolution errors while serving." >&2
            cat /tmp/smoke-server.log >&2
            exit 1
          fi

          # The requests above cannot prove the database packages resolve: there is no
          # database in CI, so those routes fail on ECONNREFUSED *before* importing
          # mongoose. That is exactly how the bson break shipped green. This loads the
          # externalized server packages directly -- no database needed.
          if ! node "$GITHUB_WORKSPACE/scripts/verify-standalone-artifact.mjs" /tmp/smoke; then
            echo "FATAL: the packaged artifact cannot resolve its own modules." >&2
            exit 1
          fi
          echo "Smoke test passed."

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: /tmp/node-app.tar.gz
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unpack the tarball
        run: |
          mkdir -p app
          tar -xzf node-app.tar.gz -C app
          rm node-app.tar.gz

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E0EDA43D367A462CA14F8D6DF79C4131 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_261324D46CC146EE961444A85D0AA58B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EF7FFC283A3A4C5CB21924D53EB656EA }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kumbhMela'
          slot-name: 'Production'
          package: app
          startup-command: 'sh /home/site/wwwroot/startup.sh'
          clean: true
          restart: true
