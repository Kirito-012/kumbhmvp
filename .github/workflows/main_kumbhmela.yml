# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - kumbhMela

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        # --node-linker=hoisted gives a flat node_modules with no .pnpm symlink farm.
        # The build MUST run against the same layout that ships: Next bakes resolved
        # dependency paths into .next/**/*.nft.json, so building against pnpm's default
        # symlinked tree and then swapping in a flat one leaves the server chasing
        # node_modules/.pnpm/... paths that no longer exist.
        run: pnpm install --frozen-lockfile --node-linker=hoisted

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}

      - name: Assemble the standalone server
        # next.config.ts sets output:'standalone', so the build emits .next/standalone
        # containing server.js plus only the node_modules the trace says the server needs
        # (~31MB rather than a full install). Next does not copy public/ or .next/static
        # into it, so do that here; server.js serves them from those paths.
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp startup.sh .next/standalone/startup.sh

      - name: Package the standalone output as a tarball
        # Tar rather than upload-artifact's native zip: zip preserves neither symlinks
        # nor executable bits, which is what broke the original deploy.
        run: tar -czf /tmp/node-app.tar.gz -C .next/standalone .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: /tmp/node-app.tar.gz
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unpack the tarball
        run: |
          mkdir -p app
          tar -xzf node-app.tar.gz -C app
          rm node-app.tar.gz

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E0EDA43D367A462CA14F8D6DF79C4131 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_261324D46CC146EE961444A85D0AA58B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EF7FFC283A3A4C5CB21924D53EB656EA }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kumbhMela'
          slot-name: 'Production'
          package: app
          startup-command: 'sh /home/site/wwwroot/startup.sh'
