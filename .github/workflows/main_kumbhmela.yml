# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - kumbhMela

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        # --node-linker=hoisted gives a flat node_modules with no .pnpm symlink farm.
        # The build MUST run against the same layout that ships: Next bakes resolved
        # dependency paths into .next/**/*.nft.json, so building against pnpm's default
        # symlinked tree and then swapping in a flat one leaves the server chasing
        # node_modules/.pnpm/... paths that no longer exist.
        run: pnpm install --frozen-lockfile --node-linker=hoisted

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}

      - name: Assemble the standalone server
        # next.config.ts sets output:'standalone', so the build emits .next/standalone
        # containing server.js plus only the node_modules the trace says the server needs.
        # Next does not copy public/ or .next/static into it, so do that here.
        #
        # node_modules is stashed as a tarball we control rather than shipped as a live
        # directory. Azure's Oryx startup script rewrites any ./node_modules it finds --
        # it moves the directory to _del_node_modules and symlinks ./node_modules at its
        # own /node_modules -- which destroys the bundled tree before server.js can load
        # it. A tarball is invisible to that logic, and startup.sh unpacks it at boot.
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp startup.sh .next/standalone/startup.sh

          # Next's tracer emits node_modules entries that point into pnpm's store as
          # symlinks to ABSOLUTE build-machine paths (.../node_modules/.pnpm/...) — it
          # does this even under a hoisted install, where the top-level node_modules is
          # already flat. Those links resolve on the builder and nowhere else, so a
          # plain tar ships dangling links and Azure dies at boot with
          # "Cannot find module 'next/dist/compiled/cookie'".
          #
          # -h dereferences them, writing the real files into the archive instead.
          #
          # This dereferencing occasionally races on the runner: GNU tar lstats a
          # symlink, then finds its target gone by the time it opens it ("File
          # removed before we read it"), aborting the whole step. It's transient,
          # not a real missing file — retrying the tar invocation clears it.
          #
          # (A prior version of this step worked around the race by excluding
          # ALL of node_modules/.pnpm/node_modules/* as a supposedly-redundant
          # pnpm convenience layer. It isn't redundant: Next's tracer ships some
          # packages — e.g. @swc/helpers — as a stub node_modules/<pkg> containing
          # only package.json, relying on Node's directory-walk resolution to find
          # the real content at that intermediate path. Excluding all of it produced
          # a MODULE_NOT_FOUND crash in production. Do not reintroduce that broad
          # exclude.)
          #
          # The retry loop above did NOT clear the race for one specific entry:
          # node_modules/.pnpm/node_modules/semver consistently vanishes out from
          # under tar's dereference on this runner, every attempt, every run — not
          # a one-off. Unlike @swc/helpers, semver has no stub at the top-level
          # node_modules/semver for the tracer to fall back on, but it's still safe
          # to drop here: every traced reference to it (.next/**/*.nft.json) traces
          # back to devDependency-only tooling (eslint/babel/mongodb-memory-server
          # chains via `pnpm why semver`) that never runs inside the built server —
          # `grep -r 'require("semver"' .next/standalone` finds nothing. Excluding
          # just this one path, unlike the broad exclude above, leaves every other
          # .pnpm/node_modules/* package (including @swc/helpers) untouched.
          for attempt in 1 2 3; do
            rm -f .next/standalone/app-node-modules.tar.gz
            if tar -czhf .next/standalone/app-node-modules.tar.gz -C .next/standalone \
                 --exclude='node_modules/.pnpm/node_modules/semver' \
                 node_modules; then
              break
            fi
            echo "tar attempt $attempt failed" >&2
            if [ "$attempt" -eq 3 ]; then
              echo "FATAL: tar failed after 3 attempts." >&2
              exit 1
            fi
            sleep 2
          done

          # Prove the archive is self-contained before shipping it: no symlinks left,
          # and the module whose absence broke the last deploy is really in there.
          if tar -tvzf .next/standalone/app-node-modules.tar.gz | grep -q '^l'; then
            echo "FATAL: app-node-modules.tar.gz still contains symlinks." >&2
            tar -tvzf .next/standalone/app-node-modules.tar.gz | grep '^l' | head >&2
            exit 1
          fi
          if ! tar -tzf .next/standalone/app-node-modules.tar.gz \
               | grep -q '^node_modules/next/dist/compiled/cookie/index.js$'; then
            echo "FATAL: next/dist/compiled/cookie missing from the archive." >&2
            exit 1
          fi
          rm -rf .next/standalone/node_modules

      - name: Package the standalone output as a tarball
        # Tar rather than upload-artifact's native zip: zip preserves neither symlinks
        # nor executable bits, which is what broke the original deploy.
        run: tar -czf /tmp/node-app.tar.gz -C .next/standalone .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: /tmp/node-app.tar.gz
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unpack the tarball
        run: |
          mkdir -p app
          tar -xzf node-app.tar.gz -C app
          rm node-app.tar.gz

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E0EDA43D367A462CA14F8D6DF79C4131 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_261324D46CC146EE961444A85D0AA58B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EF7FFC283A3A4C5CB21924D53EB656EA }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kumbhMela'
          slot-name: 'Production'
          package: app
          startup-command: 'sh /home/site/wwwroot/startup.sh'
          clean: true
          restart: true
